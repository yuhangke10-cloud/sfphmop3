<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="prototype-version" content="Option1 0.7.2">
  <title>CRL-CdM System™-Op1</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <section id="passwordGate" aria-label="Password required">
    <input id="passwordInput" type="password" autocomplete="off" placeholder="Password" aria-label="Password" autofocus>
  </section>
  <main id="stage">
    <img id="screen" alt="CRL CdM System Option 1" draggable="false" decoding="async" fetchpriority="high">
    <button id="monitorTab" type="button" aria-label="线路监控"></button>
    <button id="eventTab" type="button" aria-label="事件详情"></button>
    <button id="parameterTab" type="button" aria-label="参数详情"></button>
    <button id="mapLine" type="button" aria-label="Line"></button>
    <button id="mapSatellite" type="button" aria-label="Satellite"></button>
    <button id="mapNetwork" type="button" aria-label="Network"></button>
    <button id="themeToggle" type="button" aria-label="Light Dark"></button>
    <button id="drawChart" type="button" aria-label="查询参数"></button>
    <button id="parameterBack" type="button" aria-label="返回参数查询"></button>
  </main>
  <script src="assets/js/app.js"></script>
</body>
</html>
